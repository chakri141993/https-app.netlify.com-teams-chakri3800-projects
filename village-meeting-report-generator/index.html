<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Village Meeting Photo Report Generator</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f3f4f6;color:#17202a}
header{background:#17365d;color:#fff;padding:18px 24px;position:sticky;top:0;z-index:10}
header h1{margin:0;font-size:22px}.wrap{max-width:1200px;margin:20px auto;padding:0 16px}
.card{background:#fff;border-radius:12px;padding:18px;margin-bottom:18px;box-shadow:0 2px 10px #0001}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
label{font-weight:700;font-size:13px;display:block}input,select,textarea{width:100%;padding:10px;margin-top:5px;border:1px solid #ccd2d9;border-radius:7px;font-size:14px}
textarea{min-height:70px;resize:vertical}.btn{border:0;border-radius:7px;padding:10px 15px;cursor:pointer;font-weight:700}.primary{background:#17365d;color:#fff}.green{background:#198754;color:#fff}.danger{background:#c62828;color:#fff}.light{background:#e9eef5}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.village{border:1px solid #d6dbe1;border-radius:10px;padding:15px;margin-top:14px}.vhead{display:flex;justify-content:space-between;gap:10px;align-items:center}.vhead h3{margin:0}
.photos{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:12px}.photoBox{border:1px dashed #aab2bc;border-radius:8px;padding:8px;text-align:center;background:#fafafa}.photoBox img{width:100%;height:120px;object-fit:contain;background:#eee;border-radius:5px;margin-top:6px}.muted{color:#667085;font-size:12px}
#previewArea{display:flex;flex-direction:column;align-items:center;gap:18px}
.page{width:794px;min-height:1123px;background:#fff;border:3px solid #222;padding:28px;page-break-after:always;box-shadow:0 2px 12px #0002}
.page h2{text-align:center;margin:0 0 14px;font-size:24px}.details{display:grid;grid-template-columns:1fr 1fr;gap:6px 20px;font-size:14px;margin-bottom:16px}.details b{font-weight:700}
.photoGrid{display:grid;gap:10px}.photoGrid.n1{grid-template-columns:1fr}.photoGrid.n2,.photoGrid.n4,.photoGrid.n6{grid-template-columns:1fr 1fr}.photoGrid.n3,.photoGrid.n5{grid-template-columns:1fr 1fr}
.photoGrid.n1 img{height:650px}.photoGrid.n2 img{height:400px}.photoGrid.n3 img{height:300px}.photoGrid.n4 img{height:280px}.photoGrid.n5 img{height:240px}.photoGrid.n6 img{height:210px}
.photoGrid img{width:100%;object-fit:contain;background:#f0f0f0;border:1px solid #ccc;border-radius:4px}
@media(max-width:850px){.page{transform:scale(.8);transform-origin:top center;margin-bottom:-220px}.photos{grid-template-columns:1fr}.details{grid-template-columns:1fr}}
@media print{body{background:#fff}.noPrint,header,.controls{display:none!important}.wrap{max-width:none;margin:0;padding:0}.card{box-shadow:none;padding:0}.page{box-shadow:none;margin:0;border:3px solid #222}}
</style>
</head>
<body>
<header><h1>Village Meeting Photo Report Generator</h1></header>
<div class="wrap">
<section class="card controls">
<h2>Common Details</h2>
<p class="muted">Enter details once. They automatically apply to every village unless you override them for an individual page.</p>
<div class="grid">
<div><label>Type of Meeting</label><input id="meetingType" value="గ్రామసభ"></div>
<div><label>Meeting Title</label><input id="meetingTitle" value="గ్రామ పంచాయతీ సమావేశం"></div>
<div><label>Meeting Date</label><input id="meetingDate" type="date"></div>
<div><label>Mandal</label><input id="mandal"></div>
<div><label>District</label><input id="district"></div>
<div><label>Other Common Details</label><input id="commonOther"></div>
</div>
<div class="grid" style="margin-top:12px">
<div><label>Headings on every page?</label><select id="repeatHeadings"><option value="yes">Yes</option><option value="no">No</option></select></div>
<div><label>Default Photos per Page</label><select id="defaultPhotoCount"><option>1</option><option>2</option><option>3</option><option selected>4</option><option>5</option><option>6</option></select></div>
</div>
<div class="actions">
<button class="btn primary" onclick="addVillage()">+ Add Village / Page</button>
<button class="btn green" onclick="renderPreview()">Preview Report</button>
<button class="btn light" onclick="window.print()">Print / Save as PDF</button>
<button class="btn light" onclick="downloadHTML()">Save Project</button>
</div>
</section>
<section class="card controls"><h2>Village Pages</h2><div id="villages"></div></section>
<section class="card"><h2>Preview</h2><div id="previewArea"><p class="muted">Add a village and click Preview Report.</p></div></section>
</div>
<script>
let villages=[];
function common(){return {meetingType:document.getElementById('meetingType').value,meetingTitle:document.getElementById('meetingTitle').value,meetingDate:document.getElementById('meetingDate').value,mandal:document.getElementById('mandal').value,district:document.getElementById('district').value,other:document.getElementById('commonOther').value};}
function addVillage(){const count=+document.getElementById('defaultPhotoCount').value;villages.push({name:'',count,photos:[],override:{meetingType:false,meetingTitle:false,meetingDate:false,mandal:false,district:false,other:false},vals:{}});renderVillageForms();}
function removeVillage(i){villages.splice(i,1);renderVillageForms();}
function update(i,key,val){villages[i][key]=val;}
function setPhotoCount(i,val){villages[i].count=+val;villages[i].photos=Array.from({length:+val},(_,k)=>villages[i].photos[k]||null);renderVillageForms();}
function renderVillageForms(){const root=document.getElementById('villages');if(!villages.length){root.innerHTML='<p class="muted">No village pages added yet.</p>';return}root.innerHTML=villages.map((v,i)=>`<div class="village"><div class="vhead"><h3>Page ${i+1}</h3><button class="btn danger" onclick="removeVillage(${i})">Remove</button></div><div class="grid" style="margin-top:10px"><div><label>GP / Village Name</label><input value="${esc(v.name)}" oninput="update(${i},'name',this.value)" placeholder="e.g. Chimanapalli"></div><div><label>Photos on this page</label><select onchange="setPhotoCount(${i},this.value)">${[1,2,3,4,5,6].map(n=>`<option ${v.count==n?'selected':''}>${n}</option>`).join('')}</select></div></div><details style="margin-top:12px"><summary><b>Override common details for this page</b></summary>${overrideField(i,'meetingType','Type of Meeting')}${overrideField(i,'meetingTitle','Meeting Title')}${overrideField(i,'meetingDate','Meeting Date','date')}${overrideField(i,'mandal','Mandal')}${overrideField(i,'district','District')}${overrideField(i,'other','Other Details')}</details><div class="photos">${Array.from({length:v.count},(_,p)=>`<div class="photoBox"><b>Photo ${p+1}</b><input type="file" accept="image/*" onchange="photoUpload(${i},${p},this.files[0])">${v.photos[p]?`<img src="${v.photos[p]}" alt="Photo ${p+1}">`:''}</div>`).join('')}</div></div>`).join('');}
function overrideField(i,key,label,type='text'){const v=villages[i],checked=v.override[key];return `<div style="display:grid;grid-template-columns:180px 1fr;gap:8px;align-items:center;margin-top:8px"><label><input type="checkbox" ${checked?'checked':''} onchange="villages[${i}].override.${key}=this.checked;renderVillageForms()"> Override ${label}</label><input type="${type}" value="${esc(v.vals[key]||'')}" ${checked?'':'disabled'} oninput="villages[${i}].vals.${key}=this.value"></div>`;}
function photoUpload(i,p,file){if(!file)return;const reader=new FileReader();reader.onload=e=>{villages[i].photos[p]=e.target.result;renderVillageForms();};reader.readAsDataURL(file);}
function valueFor(v,key){return v.override[key]?v.vals[key]:common()[key];}
function fmtDate(x){if(!x)return '';const d=new Date(x+'T00:00:00');return isNaN(d)?x:d.toLocaleDateString('en-GB');}
function renderPreview(){const root=document.getElementById('previewArea');if(!villages.length){root.innerHTML='<p class="muted">Add at least one village.</p>';return}root.innerHTML=villages.map((v,i)=>{const showHead=document.getElementById('repeatHeadings').value==='yes'||i===0;const photos=v.photos.filter(Boolean);return `<div class="page">${showHead?`<h2>${esc(valueFor(v,'meetingTitle')||'Village Meeting Report')}</h2><div class="details"><div><b>Village / GP:</b> ${esc(v.name)}</div><div><b>Type of Meeting:</b> ${esc(valueFor(v,'meetingType'))}</div><div><b>Meeting Date:</b> ${esc(fmtDate(valueFor(v,'meetingDate')))}</div><div><b>Mandal:</b> ${esc(valueFor(v,'mandal'))}</div><div><b>District:</b> ${esc(valueFor(v,'district'))}</div><div><b>Other:</b> ${esc(valueFor(v,'other'))}</div></div>`:`<h2>${esc(v.name)}</h2>`}<div class="photoGrid n${v.count}">${photos.map(src=>`<img src="${src}">`).join('')}</div></div>`;}).join('');}
function esc(s){return String(s||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));}
function downloadHTML(){const blob=new Blob([document.documentElement.outerHTML],{type:'text/html'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='village-meeting-report-generator.html';a.click();}
document.getElementById('meetingDate').value=new Date().toISOString().slice(0,10);renderVillageForms();
</script>
</body></html>
