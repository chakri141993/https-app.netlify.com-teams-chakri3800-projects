<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Village Meeting Photo Report Generator</title>
<script src="https://cdn.jsdelivr.net/npm/docx@9.1.0/build/index.umd.js"></script>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f3f4f6;color:#17202a}header{background:#17365d;color:#fff;padding:18px 24px;position:sticky;top:0;z-index:10}header h1{margin:0;font-size:22px}.wrap{max-width:1200px;margin:20px auto;padding:0 16px}.card{background:#fff;border-radius:12px;padding:18px;margin-bottom:18px;box-shadow:0 2px 10px #0001}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}label{font-weight:700;font-size:13px;display:block}input,select{width:100%;padding:10px;margin-top:5px;border:1px solid #ccd2d9;border-radius:7px;font-size:14px}.btn{border:0;border-radius:7px;padding:10px 15px;cursor:pointer;font-weight:700}.primary{background:#17365d;color:#fff}.green{background:#198754;color:#fff}.danger{background:#c62828;color:#fff}.light{background:#e9eef5}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.muted{color:#667085;font-size:12px}.addBelow{display:flex;justify-content:center;margin-top:18px;padding-top:14px;border-top:1px solid #e1e5ea}.addBelow .btn{font-size:16px;padding:12px 24px}.village{border:1px solid #d6dbe1;border-radius:10px;padding:15px;margin-top:14px}.vhead{display:flex;justify-content:space-between;align-items:center}.photos{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:12px}.photoBox{border:1px dashed #aab2bc;border-radius:8px;padding:8px;text-align:center;background:#fafafa}.photoBox img{width:100%;height:120px;object-fit:contain;background:#eee;border-radius:5px;margin-top:6px}#previewArea{display:flex;flex-direction:column;align-items:center;gap:18px}.page{width:794px;height:1123px;background:#fff;border:3px solid #222;padding:26px;page-break-after:always;overflow:hidden;display:flex;flex-direction:column}.page:last-child{page-break-after:auto}.gpName{text-align:center;margin:0 0 4px;font-size:34px;font-weight:800;line-height:1.12}.meetingTitle{text-align:center;margin:0 0 10px;font-size:20px;font-weight:700}.details{display:grid;grid-template-columns:1fr 1fr;gap:5px 20px;font-size:14px;margin-bottom:12px}.photoGrid{display:grid;gap:8px;flex:1;min-height:0;overflow:hidden}.photoGrid.n1{grid-template-columns:1fr;grid-template-rows:1fr}.photoGrid.n2,.photoGrid.n3,.photoGrid.n4,.photoGrid.n5,.photoGrid.n6{grid-template-columns:1fr 1fr}.photoGrid.n2{grid-template-rows:1fr}.photoGrid.n3,.photoGrid.n4{grid-template-rows:1fr 1fr}.photoGrid.n5,.photoGrid.n6{grid-template-rows:1fr 1fr 1fr}.photoCell{min-width:0;min-height:0;display:flex;align-items:center;justify-content:center;border:1px solid #ccc;background:#f7f7f7;overflow:hidden}.photoCell img{max-width:100%;max-height:100%;width:auto;height:auto;object-fit:contain}.photoLabel{font-size:16px;font-weight:700;color:#667085}@page{size:A4 portrait;margin:0}@media print{body{background:#fff!important}.controls,header,.preview-card>h2{display:none!important}.wrap{margin:0!important;padding:0!important}.card{padding:0!important;margin:0!important;box-shadow:none!important}.page{width:210mm!important;height:297mm!important;padding:7mm!important;border:1.5mm solid #222!important;box-shadow:none!important;page-break-after:always!important}.page:last-child{page-break-after:auto!important}.gpName{font-size:25pt!important;margin-bottom:2mm!important}.meetingTitle{font-size:15pt!important;margin-bottom:3mm!important}.details{font-size:9.5pt!important;margin-bottom:3mm!important}.photoGrid{gap:2mm!important}.photoCell img{max-width:100%!important;max-height:100%!important}.photoLabel{font-size:11pt!important}}
</style>
</head>
<body>
<header><h1>Village Meeting Photo Report Generator</h1></header>
<div class="wrap">
<section class="card controls">
<h2>Common Details</h2><p class="muted">Enter details once. They apply to every village unless overridden.</p>
<div class="grid">
<div><label>Type of Meeting</label><input id="meetingType" value="గ్రామసభ"></div>
<div><label>Meeting Title</label><input id="meetingTitle" value="గ్రామ పంచాయతీ సమావేశం"></div>
<div><label>Meeting Date (DD/MM/YYYY)</label><input id="meetingDate" type="text" inputmode="numeric" maxlength="10" placeholder="DD/MM/YYYY"></div>
<div><label>Mandal</label><input id="mandal"></div>
<div><label>District</label><input id="district"></div>
<div><label>Other Common Details</label><input id="commonOther"></div>
</div>
<div class="grid" style="margin-top:12px"><div><label>Headings on every page?</label><select id="repeatHeadings"><option value="yes">Yes</option><option value="no">No</option></select></div><div><label>Default Photos per Page</label><select id="defaultPhotoCount"><option>1</option><option>2</option><option>3</option><option selected>4</option><option>5</option><option>6</option></select></div></div>
<div class="actions"><button class="btn green" onclick="renderPreview()">Preview Report</button><button class="btn light" onclick="preparePrint()">Print / Save as PDF</button><button class="btn green" onclick="downloadWord()">Download Word (.docx)</button></div>
</section>
<section class="card controls"><h2>Village Pages</h2><div id="villages"></div><div class="addBelow"><button class="btn primary" onclick="addVillage()">＋ Add Village / Page</button></div></section>
<section class="card preview-card"><h2>Preview</h2><div id="previewArea"><p class="muted">Add a village and click Preview Report.</p></div></section>
</div>
<script>
let villages=[];
const common=()=>({meetingType:meetingType.value,meetingTitle:meetingTitle.value,meetingDate:meetingDate.value,mandal:mandal.value,district:district.value,other:commonOther.value});
const esc=s=>String(s||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
function formatDateInput(el){let v=el.value.replace(/\D/g,'').slice(0,8);if(v.length>4)v=v.slice(0,2)+'/'+v.slice(2,4)+'/'+v.slice(4);else if(v.length>2)v=v.slice(0,2)+'/'+v.slice(2);el.value=v}
meetingDate.addEventListener('input',e=>formatDateInput(e.target));
function parseDate(s){let m=String(s||'').match(/^(\d{2})\/(\d{2})\/(\d{4})$/);return m?{d:m[1],mo:m[2],y:m[3]}:null}
function dateDisplay(s){let x=parseDate(s);if(!x)return s||'';let names=['January','February','March','April','May','June','July','August','September','October','November','December'];let name=names[+x.mo-1]||x.mo;return x.d+'/'+x.mo+'/'+x.y+' ('+x.d+' '+name+' '+x.y+')'}
function addVillage(){let n=+defaultPhotoCount.value;villages.push({name:'',count:n,photos:Array(n).fill(null),override:{meetingType:false,meetingTitle:false,meetingDate:false,mandal:false,district:false,other:false},vals:{}});renderVillageForms()}
function removeVillage(i){villages.splice(i,1);renderVillageForms();renderPreview()}
function setPhotoCount(i,n){n=+n;villages[i].count=n;villages[i].photos=Array.from({length:n},(_,k)=>villages[i].photos[k]||null);renderVillageForms()}
function overrideField(i,k,label,type='text'){let v=villages[i],on=v.override[k];return '<div style="display:grid;grid-template-columns:180px 1fr;gap:8px;align-items:center;margin-top:8px"><label><input type="checkbox" '+(on?'checked':'')+' onchange="villages['+i+'].override.'+k+'=this.checked;renderVillageForms()"> Override '+label+'</label><input type="'+type+'" value="'+esc(v.vals[k]||'')+'" '+(on?'':'disabled')+' oninput="villages['+i+'].vals.'+k+'=this.value"></div>'}
function renderVillageForms(){let r=document.getElementById('villages');if(!villages.length){r.innerHTML='<p class="muted">No village pages added yet.</p>';return}r.innerHTML=villages.map((v,i)=>'<div class="village"><div class="vhead"><h3>Page '+(i+1)+'</h3><button class="btn danger" onclick="removeVillage('+i+')">Remove</button></div><div class="grid" style="margin-top:10px"><div><label>GP / Village Name</label><input value="'+esc(v.name)+'" oninput="villages['+i+'].name=this.value" placeholder="e.g. Chimanapalli"></div><div><label>Photos on this page</label><select onchange="setPhotoCount('+i+',this.value)">'+[1,2,3,4,5,6].map(n=>'<option '+(n==v.count?'selected':'')+'>'+n+'</option>').join('')+'</select></div></div><details style="margin-top:12px"><summary><b>Override common details for this page</b></summary>'+overrideField(i,'meetingType','Type of Meeting')+overrideField(i,'meetingTitle','Meeting Title')+overrideField(i,'meetingDate','Meeting Date')+overrideField(i,'mandal','Mandal')+overrideField(i,'district','District')+overrideField(i,'other','Other Details')+'</details><div class="photos">'+Array.from({length:v.count},(_,p)=>'<div class="photoBox"><b>Photo '+(p+1)+'</b><input type="file" accept="image/*" onchange="photoUpload('+i+','+p+',this.files[0])">'+(v.photos[p]?'<img src="'+v.photos[p]+'">':'')+'</div>').join('')+'</div></div>').join('')}
function fileToDataUrl(file){return new Promise((resolve,reject)=>{let fr=new FileReader();fr.onload=e=>resolve(e.target.result);fr.onerror=reject;fr.readAsDataURL(file)})}
function normalizeToPng(src){return new Promise((resolve,reject)=>{let im=new Image();im.onload=()=>{let c=document.createElement('canvas');c.width=im.naturalWidth||im.width||1;c.height=im.naturalHeight||im.height||1;let ctx=c.getContext('2d');ctx.drawImage(im,0,0);resolve(c.toDataURL('image/png'))};im.onerror=()=>reject(new Error('Image could not be decoded'));im.src=src})}
function pngBytes(src){let b=src.split(',')[1],bin=atob(b),a=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)a[i]=bin.charCodeAt(i);return a}
async function photoUpload(i,p,file){if(!file)return;try{let src=await fileToDataUrl(file);villages[i].photos[p]=await normalizeToPng(src);renderVillageForms();renderPreview()}catch(e){alert('Photo could not be processed. Please select another image.')}}
function valueFor(v,k){return v.override[k]?v.vals[k]:common()[k]}
function pageHtml(v,i){let show=document.getElementById('repeatHeadings').value==='yes'||i===0;let gp=v.name||'GP / Village Name';let title=show?(valueFor(v,'meetingTitle')||'Village Meeting Report'):'';let d=show?'<div class="details"><div><b>Type of Meeting:</b> '+esc(valueFor(v,'meetingType'))+'</div><div><b>Meeting Date:</b> '+esc(dateDisplay(valueFor(v,'meetingDate')))+'</div><div><b>Mandal:</b> '+esc(valueFor(v,'mandal'))+'</div><div><b>District:</b> '+esc(valueFor(v,'district'))+'</div><div><b>Other:</b> '+esc(valueFor(v,'other'))+'</div></div>':'';let cells=Array.from({length:v.count},(_,p)=>v.photos[p]?'<div class="photoCell"><img src="'+v.photos[p]+'"></div>':'<div class="photoCell"><span class="photoLabel">Photo '+(p+1)+'</span></div>').join('');return '<div class="page"><h2 class="gpName">'+esc(gp)+'</h2>'+(show?'<div class="meetingTitle">'+esc(title)+'</div>':'')+d+'<div class="photoGrid n'+v.count+'">'+cells+'</div></div>'}
function renderPreview(){previewArea.innerHTML=villages.length?villages.map(pageHtml).join(''):'<p class="muted">Add at least one village.</p>'}
function preparePrint(){renderPreview();setTimeout(()=>print(),300)}
function loadSize(src){return new Promise((ok,bad)=>{let im=new Image();im.onload=()=>ok([im.naturalWidth||1,im.naturalHeight||1]);im.onerror=()=>bad(new Error('Image size could not be read'));im.src=src})}
function fit(w,h,mw,mh){let r=Math.min(mw/w,mh/h);return {width:Math.max(40,Math.round(w*r)),height:Math.max(40,Math.round(h*r))}}
async function downloadWord(){try{
if(!villages.length){alert('Please add at least one village page.');return}if(!window.docx){alert('Word generator is still loading. Refresh the page once and try again.');return}
const D=window.docx;const {Document,Packer,Paragraph,TextRun,ImageRun,AlignmentType,PageBreak,Table,TableRow,TableCell,WidthType,BorderStyle,VerticalAlign}=D;let children=[];
for(let i=0;i<villages.length;i++){let v=villages[i];if(i)children.push(new Paragraph({children:[new PageBreak()]}));let show=repeatHeadings.value==='yes'||i===0;
children.push(new Paragraph({alignment:AlignmentType.CENTER,spacing:{after:60},children:[new TextRun({text:v.name||'GP / Village Name',bold:true,size:44})]}));
if(show)children.push(new Paragraph({alignment:AlignmentType.CENTER,spacing:{after:120},children:[new TextRun({text:valueFor(v,'meetingTitle')||'Village Meeting Report',bold:true,size:24})]}));
if(show){let lines=['Type of Meeting: '+(valueFor(v,'meetingType')||''),'Meeting Date: '+dateDisplay(valueFor(v,'meetingDate')),'Mandal: '+(valueFor(v,'mandal')||''),'District: '+(valueFor(v,'district')||''),'Other: '+(valueFor(v,'other')||'')];children.push(new Paragraph({spacing:{after:160},children:[new TextRun({text:lines.join('   |   '),size:18})]}))}
let rows=[],idx=0,rowCount=Math.ceil(v.count/2),maxH=Math.max(120,Math.floor(500/rowCount));
for(let r=0;r<rowCount;r++){let cells=[];for(let c=0;c<2;c++){let p=idx++,cc=[];if(p<v.count&&v.photos[p]){let png=await normalizeToPng(v.photos[p]);let [w,h]=await loadSize(png);let f=fit(w,h,270,maxH);let bytes=pngBytes(png);cc=[new Paragraph({alignment:AlignmentType.CENTER,children:[new ImageRun({type:'png',data:bytes,transformation:{width:f.width,height:f.height},altText:{title:'Photo '+(p+1),description:'Village meeting photo '+(p+1),name:'Photo '+(p+1)}})]})]}else if(p<v.count)cc=[new Paragraph({alignment:AlignmentType.CENTER,children:[new TextRun({text:'Photo '+(p+1),size:18})]})];else cc=[new Paragraph({children:[]})];cells.push(new TableCell({width:{size:4500,type:WidthType.DXA},verticalAlign:VerticalAlign.CENTER,children:cc,borders:{top:{style:BorderStyle.SINGLE,size:4,color:'BFBFBF'},bottom:{style:BorderStyle.SINGLE,size:4,color:'BFBFBF'},left:{style:BorderStyle.SINGLE,size:4,color:'BFBFBF'},right:{style:BorderStyle.SINGLE,size:4,color:'BFBFBF'}}}))}rows.push(new TableRow({children:cells}))}
children.push(new Table({width:{size:9000,type:WidthType.DXA},columnWidths:[4500,4500],rows}))}
let doc=new Document({creator:'Village Meeting Photo Report Generator',title:'Village Meeting Photo Report',sections:[{properties:{page:{size:{width:11906,height:16838},margin:{top:720,right:720,bottom:720,left:720}}},children}]});let blob=await Packer.toBlob(doc);let url=URL.createObjectURL(blob);let a=document.createElement('a');a.href=url;a.download='Village-Meeting-Photo-Report.docx';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),5000)
}catch(e){console.error(e);alert('Word export failed: '+(e.message||e))}}
renderVillageForms();
</script>
</body>
</html>
