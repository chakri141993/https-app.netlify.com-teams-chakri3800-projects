<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Village Meeting Photo Report Generator</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f3f4f6;color:#17202a}header{background:#17365d;color:#fff;padding:18px 24px;position:sticky;top:0;z-index:10}header h1{margin:0;font-size:22px}.wrap{max-width:1200px;margin:20px auto;padding:0 16px}.card{background:#fff;border-radius:12px;padding:18px;margin-bottom:18px;box-shadow:0 2px 10px #0001}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}label{font-weight:700;font-size:13px;display:block}input,select{width:100%;padding:10px;margin-top:5px;border:1px solid #ccd2d9;border-radius:7px;font-size:14px}.btn{border:0;border-radius:7px;padding:10px 15px;cursor:pointer;font-weight:700}.primary{background:#17365d;color:#fff}.green{background:#198754;color:#fff}.danger{background:#c62828;color:#fff}.light{background:#e9eef5}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.addBelow{display:flex;justify-content:center;margin-top:18px;padding-top:14px;border-top:1px solid #e1e5ea}.addBelow .btn{font-size:16px;padding:12px 24px}.village{border:1px solid #d6dbe1;border-radius:10px;padding:15px;margin-top:14px}.vhead{display:flex;justify-content:space-between;gap:10px;align-items:center}.vhead h3{margin:0}.photos{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:12px}.photoBox{border:1px dashed #aab2bc;border-radius:8px;padding:8px;text-align:center;background:#fafafa}.photoBox img{width:100%;height:120px;object-fit:contain;background:#eee;border-radius:5px;margin-top:6px}.muted{color:#667085;font-size:12px}#previewArea{display:flex;flex-direction:column;align-items:center;gap:18px}.page{width:794px;height:1123px;background:#fff;border:3px solid #222;padding:28px;page-break-after:always;break-after:page;box-shadow:0 2px 12px #0002;overflow:hidden;display:flex;flex-direction:column}.page:last-child{page-break-after:auto}.page h2{text-align:center;margin:0 0 12px;font-size:24px}.details{display:grid;grid-template-columns:1fr 1fr;gap:6px 20px;font-size:14px;margin-bottom:14px}.photoGrid{display:grid;gap:10px;flex:1;min-height:0;overflow:hidden}.photoGrid.n1{grid-template-columns:1fr;grid-template-rows:1fr}.photoGrid.n2{grid-template-columns:1fr 1fr;grid-template-rows:1fr}.photoGrid.n3,.photoGrid.n4{grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr}.photoGrid.n5,.photoGrid.n6{grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr 1fr}.photoCell{min-width:0;min-height:0;display:flex;align-items:center;justify-content:center;border:1px solid #ccc;background:#f0f0f0;overflow:hidden}.photoCell img{display:block;max-width:100%;max-height:100%;width:auto;height:auto;object-fit:contain}.photoPlaceholder{color:#777;font-size:13px}@media(max-width:850px){.page{transform:scale(.8);transform-origin:top center;margin-bottom:-220px}.photos{grid-template-columns:1fr}.details{grid-template-columns:1fr}}@page{size:A4 portrait;margin:0}@media print{body{background:#fff!important;margin:0!important}.noPrint,header,.controls{display:none!important}.wrap{max-width:none;margin:0!important;padding:0!important}.card{box-shadow:none!important;padding:0!important;margin:0!important}.preview-card>h2{display:none!important}#previewArea{display:block!important;margin:0!important}.page{width:210mm!important;height:297mm!important;margin:0!important;padding:8mm!important;border:1.5mm solid #222!important;box-shadow:none!important;page-break-after:always!important;overflow:hidden!important}.page:last-child{page-break-after:auto!important}.page h2{font-size:18pt!important;margin:0 0 4mm!important}.details{font-size:10pt!important;margin-bottom:4mm!important}.photoGrid{gap:2mm!important}.photoCell{overflow:hidden!important}.photoCell img{max-width:100%!important;max-height:100%!important;width:auto!important;height:auto!important}}
</style>
</head>
<body>
<header><h1>Village Meeting Photo Report Generator</h1></header>
<div class="wrap">
<section class="card controls">
<h2>Common Details</h2><p class="muted">Enter details once. They apply to every village unless overridden.</p>
<div class="grid"><div><label>Type of Meeting</label><input id="meetingType" value="గ్రామసభ"></div><div><label>Meeting Title</label><input id="meetingTitle" value="గ్రామ పంచాయతీ సమావేశం"></div><div><label>Meeting Date</label><input id="meetingDate" type="date"></div><div><label>Mandal</label><input id="mandal"></div><div><label>District</label><input id="district"></div><div><label>Other Common Details</label><input id="commonOther"></div></div>
<div class="grid" style="margin-top:12px"><div><label>Headings on every page?</label><select id="repeatHeadings"><option value="yes">Yes</option><option value="no">No</option></select></div><div><label>Default Photos per Page</label><select id="defaultPhotoCount"><option>1</option><option>2</option><option>3</option><option selected>4</option><option>5</option><option>6</option></select></div></div>
<div class="actions"><button class="btn green" onclick="renderPreview()">Preview Report</button><button class="btn light" onclick="preparePrint()">Print / Save as PDF</button><button class="btn green" onclick="downloadWord()">Download Word (.doc)</button><button class="btn light" onclick="downloadHTML()">Save Project</button></div>
</section>
<section class="card controls"><h2>Village Pages</h2><div id="villages"></div><div class="addBelow"><button class="btn primary" onclick="addVillage()">＋ Add Village / Page</button></div></section>
<section class="card preview-card"><h2>Preview</h2><div id="previewArea"><p class="muted">Add a village and click Preview Report.</p></div></section>
</div>
<script>
let villages=[];
function common(){return{meetingType:meetingType.value,meetingTitle:meetingTitle.value,meetingDate:meetingDate.value,mandal:mandal.value,district:district.value,other:commonOther.value}}
function addVillage(){let n=+defaultPhotoCount.value;villages.push({name:'',count:n,photos:Array(n).fill(null),override:{meetingType:false,meetingTitle:false,meetingDate:false,mandal:false,district:false,other:false},vals:{}});renderVillageForms()}
function removeVillage(i){villages.splice(i,1);renderVillageForms();renderPreview()}
function update(i,k,v){villages[i][k]=v}
function setPhotoCount(i,n){n=+n;villages[i].count=n;villages[i].photos=Array.from({length:n},(_,k)=>villages[i].photos[k]||null);renderVillageForms()}
function esc(s){return String(s||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function overrideField(i,k,l,t='text'){let v=villages[i],c=v.override[k];return `<div style="display:grid;grid-template-columns:180px 1fr;gap:8px;align-items:center;margin-top:8px"><label><input type="checkbox" ${c?'checked':''} onchange="villages[${i}].override.${k}=this.checked;renderVillageForms()"> Override ${l}</label><input type="${t}" value="${esc(v.vals[k]||'')}" ${c?'':'disabled'} oninput="villages[${i}].vals.${k}=this.value"></div>`}
function renderVillageForms(){let r=document.getElementById('villages');if(!villages.length){r.innerHTML='<p class="muted">No village pages added yet. Click “＋ Add Village / Page” below.</p>';return}r.innerHTML=villages.map((v,i)=>`<div class="village"><div class="vhead"><h3>Page ${i+1}</h3><button class="btn danger" onclick="removeVillage(${i})">Remove</button></div><div class="grid" style="margin-top:10px"><div><label>GP / Village Name</label><input value="${esc(v.name)}" oninput="update(${i},'name',this.value)" placeholder="e.g. Chimanapalli"></div><div><label>Photos on this page</label><select onchange="setPhotoCount(${i},this.value)">${[1,2,3,4,5,6].map(n=>`<option ${v.count==n?'selected':''}>${n}</option>`).join('')}</select></div></div><details style="margin-top:12px"><summary><b>Override common details for this page</b></summary>${overrideField(i,'meetingType','Type of Meeting')}${overrideField(i,'meetingTitle','Meeting Title')}${overrideField(i,'meetingDate','Meeting Date','date')}${overrideField(i,'mandal','Mandal')}${overrideField(i,'district','District')}${overrideField(i,'other','Other Details')}</details><div class="photos">${Array.from({length:v.count},(_,p)=>`<div class="photoBox"><b>Photo ${p+1}</b><input type="file" accept="image/*" onchange="photoUpload(${i},${p},this.files[0])">${v.photos[p]?`<img src="${v.photos[p]}">`:''}</div>`).join('')}</div></div>`).join('')}
function photoUpload(i,p,f){if(!f)return;let r=new FileReader();r.onload=e=>{villages[i].photos[p]=e.target.result;renderVillageForms();renderPreview()};r.readAsDataURL(f)}
function valueFor(v,k){return v.override[k]?v.vals[k]:common()[k]}
function fmtDate(x){if(!x)return'';let d=new Date(x+'T00:00:00');return isNaN(d)?x:d.toLocaleDateString('en-GB')}
function pageHtml(v,i){let sh=repeatHeadings.value==='yes'||i===0,title=sh?(valueFor(v,'meetingTitle')||'Village Meeting Report'):v.name,details=sh?`<div class="details"><div><b>Village / GP:</b> ${esc(v.name)}</div><div><b>Type of Meeting:</b> ${esc(valueFor(v,'meetingType'))}</div><div><b>Meeting Date:</b> ${esc(fmtDate(valueFor(v,'meetingDate')))}</div><div><b>Mandal:</b> ${esc(valueFor(v,'mandal'))}</div><div><b>District:</b> ${esc(valueFor(v,'district'))}</div><div><b>Other:</b> ${esc(valueFor(v,'other'))}</div></div>`:'',cells=Array.from({length:v.count},(_,p)=>v.photos[p]?`<div class="photoCell"><img src="${v.photos[p]}"></div>`:`<div class="photoCell"><span class="photoPlaceholder">Photo ${p+1}</span></div>`).join('');return`<div class="page"><h2>${esc(title)}</h2>${details}<div class="photoGrid n${v.count}">${cells}</div></div>`}
function renderPreview(){if(!villages.length){previewArea.innerHTML='<p class="muted">Add at least one village.</p>';return}previewArea.innerHTML=villages.map(pageHtml).join('')}
function preparePrint(){renderPreview();setTimeout(()=>print(),300)}
function downloadHTML(){let b=new Blob([document.documentElement.outerHTML],{type:'text/html'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='village-meeting-report-generator.html';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
function wordEscape(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
function wordPage(v,i){let sh=repeatHeadings.value==='yes'||i===0,title=sh?(valueFor(v,'meetingTitle')||'Village Meeting Report'):v.name;let d=sh?`<table style="width:100%;font-size:10pt;margin-bottom:10pt"><tr><td><b>Village / GP:</b> ${wordEscape(v.name)}</td><td><b>Type of Meeting:</b> ${wordEscape(valueFor(v,'meetingType'))}</td></tr><tr><td><b>Meeting Date:</b> ${wordEscape(fmtDate(valueFor(v,'meetingDate')))}</td><td><b>Mandal:</b> ${wordEscape(valueFor(v,'mandal'))}</td></tr><tr><td><b>District:</b> ${wordEscape(valueFor(v,'district'))}</td><td><b>Other:</b> ${wordEscape(valueFor(v,'other'))}</td></tr></table>`:'';let cells=Array.from({length:v.count},(_,p)=>`<td style="width:50%;height:${Math.max(150,Math.floor(620/Math.ceil(v.count/2)))}px;text-align:center;vertical-align:middle;border:1px solid #cccccc">${v.photos[p]?`<img src="${v.photos[p]}" style="max-width:100%;max-height:100%;object-fit:contain">`:`Photo ${p+1}`}</td>`);let rows='';for(let x=0;x<cells.length;x+=2)rows+=`<tr>${cells[x]}${cells[x+1]||'<td style="width:50%;border:1px solid #cccccc"></td>'}</tr>`;return`<div style="page-break-after:${i===villages.length-1?'auto':'always'};width:100%;min-height:1000px;border:2px solid #222;padding:20px;margin:0;font-family:Arial,sans-serif"><h2 style="text-align:center;margin:0 0 10px">${wordEscape(title)}</h2>${d}<table style="border-collapse:collapse;width:100%;table-layout:fixed"><tbody>${rows}</tbody></table></div>`}
function downloadWord(){if(!villages.length){alert('Please add at least one village page.');return}let body=villages.map(wordPage).join('');let html='<!DOCTYPE html><html><head><meta charset="utf-8"><style>@page{size:A4 portrait;margin:12mm}body{margin:0;background:#fff}table{border-collapse:collapse}</style></head><body>'+body+'</body></html>';let blob=new Blob(['\ufeff',html],{type:'application/msword'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='Village-Meeting-Photo-Report.doc';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),3000)}
addVillage();
</script>
</body>
</html>
